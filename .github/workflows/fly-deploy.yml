name: Fly Deploy

# Manual-trigger only. There is no staging environment, and deploying the API
# restarts its single machine, which drops any in-flight jobs (they are held in
# memory). Pick a quiet moment rather than deploying on every push.
#
# Requires one repository secret: FLY_API_TOKEN
#   fly tokens create deploy --app podslacker-api
#   (a single org-scoped token covering both apps also works)
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to deploy
        type: choice
        default: both
        options:
          - both
          - api
          - web

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false   # never cancel a running deploy — let it finish

jobs:
  deploy-api:
    name: Deploy podslacker-api
    if: inputs.app == 'both' || inputs.app == 'api'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src   # Docker build context for both images
    steps:
      - uses: actions/checkout@v7

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy
        run: flyctl deploy --config fly.api.toml --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    name: Deploy podslacker-web
    # API first, so the web UI never comes up against an older API. Runs when
    # the API job succeeded or was skipped (web-only deploy), never after a
    # failed API deploy.
    needs: deploy-api
    if: >-
      always() &&
      (inputs.app == 'both' || inputs.app == 'web') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy
        run: flyctl deploy --config fly.web.toml --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
